[package]
name = "delaylama-truce-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
description = "Truce host adapter and native editor for Delay Lama"
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap"]
clap = ["truce/clap", "dep:truce-clap", "dep:clap-sys"]
vst3 = ["truce/vst3", "dep:truce-vst3"]
lv2 = ["truce/lv2", "dep:truce-lv2"]
auv2 = ["dep:truce-au"]
auv3 = ["dep:truce-au"]
# VST2 intentionally has no feature or adapter.
au = ["dep:truce-au"]

[dependencies]
truce = { version = "6.3.0", default-features = false }
truce-gui = { version = "6.3.0", default-features = false, features = ["cpu"] }
baseview = { version = "0.1.1-truce.13", package = "baseview-truce" }
raw-window-handle = "0.6.2"
wgpu = { version = "=29.0.4", default-features = false, features = [
    "wgsl",
    "metal",
] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
crossbeam-queue = "0.3.13"
num-traits = { workspace = true }
log = "0.4.33"
delaylama-host = { path = "../host" }
delaylama-protocol = { path = "../protocol" }
delaylama-editor = { path = "../editor" }
delaylama-synthesizer = { path = "../synthesizer" }
truce-clap = { version = "6.3.0", optional = true }
clap-sys = { version = "0.5", optional = true }
truce-vst3 = { version = "6.3.0", optional = true }
truce-lv2 = { version = "6.3.0", optional = true }
truce-au = { version = "6.3.0", optional = true }

[lints]
workspace = true
